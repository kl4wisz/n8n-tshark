services:
  n8n:
    container_name: n8n
    image: n8n:2.44.7-tshark
    build:
      context: .
      dockerfile: Dockerfile.n8n-tshark
    restart: always
    ports:
      - "5678:5678"
    environment:
      - TZ=UTC
      - NODE_ENV=production
      - N8N_PROTOCOL=HTTP
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://10.0.0.80:5678/
      - NODES_EXCLUDE="[]"
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/n8n-files:/home/node/.n8n-files
      - ./data/n8n-certs:/usr/local/share/ca-certificates/custom
